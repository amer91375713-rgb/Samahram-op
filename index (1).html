  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

m 9mm;\n  box-shadow:0 6px 28px rgba(60,45,35,.20);\n  display:flex;\n  flex-direction:column;\n  overflow:hidden;\n}\n.page::before{ /* خط زخرفي علوي رفيع */\n  content:\"\";\n  position:absolute; top:0; left:0; right:0; height:6px;\n  background:linear-gradient(90deg,var(--brand-deep) 0 62%,var(--ochre) 62% 100%);\n}\n\n/* ====================== الترويسة ====================== */\n.doc-header{\n  display:flex; align-items:flex-start; justify-content:space-between;\n  gap:18px; padding-bottom:8px;\n  border-bottom:2px solid var(--brand);\n  margin-bottom:11px;\n}\n.head-title .eyebrow{\n  font-family:'Noto Naskh Arabic',serif; font-weight:500;\n  font-size:9.5pt; letter-spacing:.5px; color:var(--ochre);\n  margin:0 0 3px;\n}\n.head-title h1{\n  font-family:'Noto Naskh Arabic',serif; font-weight:700;\n  font-size:23pt; line-height:1.05; color:var(--brand-deep);\n  margin:0;\n}\n.head-right{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; }\n.head-logo{ height:46px; width:auto; display:block; }\n.form-code{\n  font-family:'Noto Naskh Arabic',serif; font-weight:600;\n  font-size:9pt; color:var(--brand);\n  border:1.5px solid var(--line-strong); border-radius:5px;\n  padding:3px 9px; background:var(--tint-2); letter-spacing:1px;\n  white-space:nowrap;\n}\n\n/* ====================== صف البيانات الأساسية ====================== */\n.meta{\n  display:grid; gap:8px; margin-bottom:11px;\n}\n.meta.cols-4{ grid-template-columns:repeat(4,1fr); }\n.meta.cols-3{ grid-template-columns:repeat(3,1fr); }\n.meta .cell{\n  border:1px solid var(--line); border-radius:6px;\n  background:var(--tint-2); padding:5px 11px;\n  display:flex; flex-direction:column; gap:2px; min-height:42px;\n}\n.meta .cell label{\n  font-family:'Noto Naskh Arabic',serif; font-weight:600;\n  font-size:8.5pt; color:var(--brand);\n}\n.field{\n  border:none; background:transparent; outline:none;\n  font-family:'Noto Naskh Arabic',serif; font-weight:500;\n  font-size:11pt; color:var(--ink); width:100%; padding:0;\n}\n.field::placeholder{ color:#B9AC9E; font-weight:400; }\n\n/* ====================== الأقسام والعناوين الفرعية ====================== */\n.section-label{\n  display:flex; align-items:center; gap:9px;\n  font-family:'Noto Naskh Arabic',serif; font-weight:600;\n  font-size:10.5pt; color:var(--brand-deep);\n  margin:2px 0 7px;\n}\n.section-label::before{\n  content:\"\"; width:9px; height:9px; transform:rotate(45deg);\n  background:var(--ochre); flex:none;\n}\n.section-label .hint{\n  font-family:'Noto Naskh Arabic',serif; font-weight:400;\n  font-size:8.5pt; color:var(--muted); margin-inline-start:auto;\n}\n\n/* ====================== الجداول ====================== */\n.content{ flex:1; display:flex; flex-direction:column; min-height:0; }\n.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:13px; }\n.grid-2.tight{ gap:11px; }\n\ntable{ width:100%; border-collapse:collapse; }\nthead th{\n  background:var(--brand-deep); color:#F6EFE6;\n  font-family:'Noto Naskh Arabic',serif; font-weight:600;\n  font-size:9.5pt; padding:6px 10px; text-align:right;\n  border:1px solid var(--brand-deep);\n}\nthead th.c{ text-align:center; }\ntbody td{\n  border:1px solid var(--line);\n  font-size:10pt; vertical-align:middle;\n}\ntbody td.item{ padding:5px 10px; font-weight:500; line-height:1.3; }\ntbody td.c{ text-align:center; }\ntbody tr:nth-child(even){ background:var(--tint-2); }\ntbody .total td{ background:var(--tint); font-weight:700; color:var(--brand-deep); }\n\n.cellinput{\n  width:100%; border:none; background:transparent; outline:none;\n  font-family:'Noto Naskh Arabic',serif;\n  font-size:10pt; color:var(--ink); padding:5px 10px; text-align:center;\n}\ntd .cellinput.right{ text-align:right; }\n\n/* خانة التأشير */\n.chk{ position:absolute; opacity:0; width:0; height:0; }\n.cbox{\n  display:inline-block; width:16px; height:16px;\n  border:1.6px solid var(--brand); border-radius:3px;\n  position:relative; vertical-align:middle; cursor:pointer; background:#fff;\n}\n.chk:checked + .cbox::after{\n  content:\"✓\"; position:absolute; inset:0;\n  display:flex; align-items:center; justify-content:center;\n  font-size:12px; font-weight:700; color:var(--ok); line-height:1;\n}\n.chk:focus-visible + .cbox{ outline:2px solid var(--ochre); outline-offset:1px; }\n.chk-inline{ display:inline-flex; align-items:center; gap:7px; cursor:pointer; }\n.chk-inline span.txt{ font-size:10pt; font-weight:500; }\n\n/* ====================== الملاحظات ====================== */\n.notes{\n  width:100%; border:1px solid var(--line); border-radius:6px;\n  background:repeating-linear-gradient(var(--paper),var(--paper) 25px,var(--line) 25px,var(--line) 26px);\n  font-family:'Noto Naskh Arabic',serif; font-size:10pt;\n  color:var(--ink); padding:4px 10px; resize:none; outline:none;\n  line-height:26px;\n}\n.note-block{ margin-top:9px; }\n\n/* ====================== التواقيع ====================== */\n.signs{\n  display:flex; gap:34px; margin-top:11px; padding-top:9px;\n  border-top:1px dashed var(--line-strong);\n}\n.sign{ flex:1; display:flex; flex-direction:column; gap:4px; }\n.sign .sline{ border-bottom:1.6px dotted var(--brand); height:26px; }\n.sign label{\n  font-family:'Noto Naskh Arabic',serif; font-weight:600;\n  font-size:9.5pt; color:var(--brand);\n}\n\n/* ====================== التذييل ====================== */\n.doc-footer{\n  margin-top:9px; padding-top:6px; border-top:1.5px solid var(--brand);\n  display:flex; align-items:center; justify-content:space-between; gap:14px;\n}\n.doc-footer .org{\n  font-size:8pt; color:var(--muted); line-height:1.5;\n}\n.doc-footer .org b{ color:var(--brand); font-weight:600; }\n.doc-footer .pg{\n  font-family:'Noto Naskh Arabic',serif; font-size:8.5pt; color:var(--brand);\n  white-space:nowrap; border-inline-start:1px solid var(--line); padding-inline-start:12px;\n}\n\n/* ====================== صفحة الغلاف ====================== */\n.cover{ justify-content:center; align-items:center; text-align:center; }\n.cover .frame{\n  position:absolute; inset:9mm; border:1.5px solid var(--line-strong);\n}\n.cover .frame::after{\n  content:\"\"; position:absolute; inset:5px; border:1px solid var(--line);\n}\n.cover-inner{ position:relative; z-index:1; width:100%; max-width:230mm; }\n.cover-logo{ height:118px; width:auto; margin:0 auto 18px; display:block; }\n.cover .eyebrow{\n  font-family:'Noto Naskh Arabic',serif; font-weight:500; font-size:12pt;\n  letter-spacing:2px; color:var(--ochre); margin:0 0 14px;\n}\n.cover h1{\n  font-family:'Noto Naskh Arabic',serif; font-weight:700; font-size:38pt;\n  color:var(--brand-deep); margin:0 0 8px; line-height:1.1;\n}\n.cover .site{\n  font-family:'Noto Naskh Arabic',serif; font-weight:500; font-size:15pt;\n  color:var(--brand); margin:0 0 4px;\n}\n.cover .dept{ font-size:11pt; color:var(--muted); margin:0; }\n.diamonds{ display:flex; gap:9px; justify-content:center; align-items:center; margin:20px 0; }\n.diamonds i{ width:7px; height:7px; transform:rotate(45deg); background:var(--ochre); display:block; }\n.diamonds i:nth-child(2){ width:10px; height:10px; background:var(--brand); }\n.toc{\n  display:grid; grid-template-columns:1fr 1fr; gap:8px 34px;\n  text-align:right; max-width:200mm; margin:6px auto 0;\n}\n.toc .toc-item{\n  display:flex; align-items:center; gap:12px;\n  padding:9px 14px; border:1px solid var(--line);\n  border-radius:7px; background:var(--tint-2);\n}\n.toc .num{\n  font-family:'Noto Naskh Arabic',serif; font-weight:600; font-size:9pt;\n  color:#fff; background:var(--brand); border-radius:5px;\n  padding:3px 8px; white-space:nowrap;\n}\n.toc .tname{ font-size:11pt; font-weight:500; color:var(--ink); }\n.cover-foot{\n  position:absolute; bottom:13mm; left:0; right:0; text-align:center;\n  font-size:8.5pt; color:var(--muted); padding:0 20mm;\n}\n.cover-foot b{ color:var(--brand); font-weight:600; }\n\n/* ====================== الطباعة ====================== */\n@page{ size:A4 landscape; margin:0; }\n@media print{\n  body{ background:#fff; }\n  .page{ margin:0; box-shadow:none; page-break-after:always; }\n  .page:last-child{ page-break-after:auto; }\n  .toolbar{ display:none !important; }\n}\n\n/* شريط أدوات الشاشة فقط */\n.toolbar{\n  position:fixed; top:calc(12px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:50;\n  background:rgba(255,255,255,.97); backdrop-filter:blur(6px);\n  border:1px solid var(--line-strong); border-radius:12px;\n  box-shadow:0 6px 22px rgba(60,45,35,.18); padding:7px 9px;\n  display:flex; align-items:center; gap:10px; max-width:96vw; flex-wrap:wrap;\n  font-family:'Noto Naskh Arabic',serif;\n}\n.toolbar .tb-brand{\n  font-weight:700; font-size:10.5pt; color:var(--brand-deep);\n  padding-inline-end:10px; border-inline-end:1px solid var(--line); white-space:nowrap;\n}\n.toolbar .tb-nav{ display:flex; gap:4px; flex-wrap:wrap; }\n.toolbar .tb-nav button{\n  font-family:'Noto Naskh Arabic',serif; font-size:9.5pt; font-weight:500;\n  color:var(--brand-deep); background:transparent;\n  border:1px solid transparent; border-radius:7px; padding:6px 11px; cursor:pointer;\n  transition:background .12s,color .12s;\n}\n.toolbar .tb-nav button:hover{ background:var(--tint); }\n.toolbar .tb-actions{ display:flex; gap:6px; padding-inline-start:10px; border-inline-start:1px solid var(--line); }\n.toolbar .tb-actions button{\n  font-family:'Noto Naskh Arabic',serif; font-size:9.5pt; font-weight:600;\n  color:var(--brand-deep); background:var(--tint-2);\n  border:1px solid var(--line); border-radius:7px; padding:6px 13px; cursor:pointer;\n}\n.toolbar .tb-actions button:hover{ background:var(--tint); }\n.toolbar .tb-actions .tb-primary{ background:var(--brand-deep); color:#F6EFE6; border-color:var(--brand-deep); }\n.toolbar .tb-actions .tb-primary:hover{ background:var(--brand); }\n\n.save-flag{\n  position:fixed; bottom:16px; left:50%; transform:translateX(-50%) translateY(8px);\n  z-index:50; background:var(--brand-deep); color:#F6EFE6;\n  fo oter\">\n    <div class=\"org\"><b>شركة فنادق ومنتجعات جبال الحجر ش.م.م<\u002Fb> · السجل التجاري 1374037 · هاتف 24390800 · ص.ب 807، ر.ب 116، غلا الصناعية، سلطنة عُمان · info@myradholding.com<\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fsection>\n\n<div class=\"arch-overlay\" id=\"archOverlay\" onclick=\"closeArchive(event)\">\n  <aside class=\"arch-drawer\" onclick=\"event.stopPropagation()\">\n    <div class=\"arch-head\">\n      <h3>أرشيف السجلات<\u002Fh3>\n      <button class=\"arch-x\" onclick=\"closeArchive()\" aria-label=\"إغلاق\">✕<\u002Fbutton>\n    <\u002Fdiv>\n    <button class=\"arch-add\" onclick=\"archiveToday()\">＋ حفظ اليوم الحالي في الأرشيف<\u002Fbutton>\n    <div class=\"arch-list\" id=\"archList\"><\u002Fdiv>\n    <p class=\"arch-note\">السجلات محفوظة في هذا المتصفح / الجهاز فقط.<\u002Fp>\n  <\u002Faside>\n<\u002Fdiv>\n\n<script>\n(function(){\n  var KEY='samharam_forms_v1';\n  var ARCH='samharam_archive_v1';\n  var fields=[].slice.call(document.querySelectorAll('input,textarea'));\n  fields.forEach(function(f,i){ f.dataset.fk='f'+i; });\n\n  function snapshot(){ var d={}; fields.forEach(function(f){ d[f.dataset.fk]= f.type==='checkbox'? f.checked : f.value; }); return d; }\n  function applyData(d){ d=d||{}; fields.forEach(function(f){ var v=d[f.dataset.fk]; if(f.type==='checkbox') f.checked=!!v; else f.value=(v==null?'':v); }); }\n  function readDraft(){ try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};} }\n  function readArch(){ try{return JSON.parse(localStorage.getItem(ARCH)||'[]');}catch(e){return [];} }\n  function writeArch(a){ try{localStorage.setItem(ARCH,JSON.stringify(a));}catch(e){} updateCount(); }\n\n  applyData(readDraft());\n\n  var flag=document.getElementById('saveFlag'), t;\n  function saveDraft(){\n    try{ localStorage.setItem(KEY, JSON.stringify(snapshot())); }catch(e){}\n    if(flag){ flag.classList.add('show'); clearTimeout(t); t=setTimeout(function(){ flag.classList.remove('show'); },1100); }\n  }\n  document.addEventListener('input',saveDraft);\n  document.addEventListener('change',saveDraft);\n\n  window.clearAll=function(){\n    if(!confirm('مسح جميع البيانات المدخلة في النموذج الحالي؟')) return;\n    applyData({}); try{localStorage.removeItem(KEY);}catch(e){}\n  };\n\n  var pages=[].slice.call(document.querySelectorAll('section.page'));\n  document.querySelectorAll('[data-go]').forEach(function(btn){\n    btn.addEventListener('click',function(){\n      var p=pages[+btn.dataset.go];\n      if(p){ var y=p.getBoundingClientRect().top+window.scrollY-12; window.scrollTo({top:y,behavior:'smooth'}); }\n    });\n  });\n\n  function isEmpty(d){ return Object.keys(d).every(function(k){ var v=d[k]; return v===''||v===false||v==null; }); }\n  function escapeHtml(s){ return String(s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c];}); }\n  function updateCount(){ var c=document.getElementById('archCount'); if(c){ var n=readArch().length; c.textContent=n?('('+n+')'):''; } }\n  function renderList(){\n    var box=document.getElementById('archList'); if(!box) return;\n    var a=readArch();\n    if(!a.length){ box.innerHTML='<p class=\"arch-empty\">لا توجد سجلات محفوظة بعد.<\u002Fp>'; return; }\n    box.innerHTML=a.map(function(r){\n      return '<div class=\"arch-item\"><span class=\"arch-label\">'+escapeHtml(r.label)+'<\u002Fspan>'+\n        '<span class=\"arch-acts\"><button onclick=\"archiveLoad('+r.id+')\">تحميل<\u002Fbutton>'+\n        '<button class=\"del\" onclick=\"archiveDelete('+r.id+')\">حذف<\u002Fbutton><\u002Fspan><\u002Fdiv>';\n    }).join('');\n  }\n\n  window.archiveToday=function(){\n    var data=snapshot();\n    if(isEmpty(data)){ alert('النموذج فارغ — لا يوجد ما يُؤرشف.'); return; }\n    var d=new Date();\n    var iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');\n    var label=prompt('تاريخ / اسم السجل:', iso);\n    if(label===null) return;\n    var a=readArch();\n    a.unshift({id:Date.now(), label:(label||iso), data:data});\n    writeArch(a); renderList();\n    if(confirm('تم الحفظ في الأرشيف ✓   —   هل تريد تفريغ النموذج لبدء يوم جديد؟')){\n      applyData({}); try{localStorage.removeItem(KEY);}catch(e){}\n    }\n    openArchive();\n  };\n  window.archiveLoad=function(id){\n    var r=readArch().filter(function(x){return x.id===id;})[0]; if(!r) return;\n    if(!confirm('تحميل سجل «'+r.label+'» إلى النموذج؟ سيُستبدل المحتوى الحالي.')) return;\n    applyData(r.data); saveDraft(); closeArchive();\n    window.scrollTo({top:0,behavior:'smooth'});\n  };\n  window.archiveDelete=function(id){\n    if(!confirm('حذف هذا السجل نهائياً؟')) return;\n    writeArch(readArch().filter(function(x){return x.id!==id;})); renderList();\n  };\n  window.openArchive=function(){ renderList(); document.getElementById('archOverlay').classList.add('open'); };\n  window.closeArchive=function(){ document.getElementById('archOverlay').classList.remove('open'); };\n\n  updateCount();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
